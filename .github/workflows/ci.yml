name: CI

# Eventos que disparan el workflow.
on:
    # Ejecuta validaciones en PR hacia main/master.
    pull_request:
        branches: [main, master]
    # Ejecuta pipeline completo al hacer push a main/master.
    push:
        branches: [main, master]
    # Permite correr el workflow manualmente desde la UI de GitHub.
    workflow_dispatch:

jobs:
    # Job de calidad: instala dependencias, corre lint y tests.
    lint-and-test:
        # Runner Linux administrado por GitHub.
        runs-on: ubuntu-latest

        steps:
            # Descarga el codigo del repositorio en el runner.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Configura Node.js y cache de npm para acelerar instalaciones.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # Instala dependencias de forma reproducible usando package-lock.
            - name: Install dependencies
              run: npm ci

            # Ejecuta reglas de estilo/calidad definidas en ESLint.
            - name: Run linter
              run: npm run lint

            # Ejecuta pruebas automaticas del proyecto.
            - name: Run tests
              run: npm test

    # Job de despliegue a GitHub Pages.
    deploy:
        runs-on: ubuntu-latest
        # Solo despliega si el job de calidad termino correctamente.
        needs: lint-and-test
        # Solo despliega desde ramas principales.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

        # Permisos minimos necesarios para publicar en GitHub Pages.
        permissions:
            contents: read
            pages: write
            id-token: write

        # Evita despliegues simultaneos; cancela uno anterior si llega otro.
        concurrency:
            group: pages
            cancel-in-progress: true

        # Asocia este job al entorno de Pages y expone la URL publicada.
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            # Descarga el codigo del repositorio en el runner.
            - name: Checkout repository
              uses: actions/checkout@v4

            # Configura Node.js y cache de npm para el build.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # Instala dependencias para compilar la app.
            - name: Install dependencies
              run: npm ci

            # Genera los archivos estaticos de produccion en dist/.
            - name: Build app
              run: npm run build

            # Crea 404.html para soportar rutas de SPA en GitHub Pages.
            - name: Add SPA fallback page
              run: cp dist/index.html dist/404.html

            # Prepara la configuracion interna de GitHub Pages para el deploy.
            - name: Setup Pages
              uses: actions/configure-pages@v5

            # Sube dist/ como artefacto que Pages va a publicar.
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

            # Publica el artefacto en GitHub Pages y devuelve la URL final.
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
